# Publica o site no GitHub Pages a cada mudança (inclusive as salvas pelo painel /admin).
name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Monta a página
        run: node build.mjs
      - name: Testes
        run: node tests/build.test.mjs && node tests/analise.test.mjs
      - name: Junta os arquivos do site
        run: |
          mkdir _site
          cp -r index.html credits.html privacidade.html favicon.svg share.jpg robots.txt assets css js admin previas conceitos _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
